services:
  # ── PostgreSQL (Auth & Analytics) ──────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: boxing-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-boxing_app}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - boxing_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-boxing_app}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── MongoDB (Biometric Data) ───────────────────────────────
  mongodb:
    image: mongo:7
    container_name: boxing-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-boxing_app}
    volumes:
      - mongodb_data:/data/db
      # - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init.js:ro  # TODO: Fix init script
    networks:
      - boxing_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  # ── Redis (Real-time Buffers) ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: boxing-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - boxing_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka UI Services (Development) ──────────────────────────
  # Removed - Using Confluent Cloud directly
  # mongo-express, kafdrop, redis-commander removed as requested

  # ── Backend API ─────────────────────────────────────────────
  backend:
    build: 
      context: .
      dockerfile: app/Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: boxing-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      - PYTHONPATH=/app
      - ENV_MODE=${ENV_MODE:-local_real}
      - SENTRY_DSN=${SENTRY_DSN}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
    working_dir: /
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "app", "--reload-exclude", "app/logs/*", "--reload-exclude", "app/dataset/*"]
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - boxing_network
    volumes:
      - ./app:/app
      - ./logs:/app/logs
      - ./dataset:/app/dataset
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/monitoring/health/simple"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # ── ML Training Service (Optional) ─────────────────────────────
  ml-trainer:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: boxing-ml-trainer
    restart: "no"
    profiles:
      - ml
    environment:
      - ENV_MODE=ml_only
    volumes:
      - ./app:/app
      - ./models:/app/models
      - ./dataset:/app/dataset
    networks:
      - boxing_network
    command: ["python", "ml_service/train_models.py"]

# ── Volumes ─────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  # Kafka volumes removed - using Confluent Cloud directly

# ── Networks ───────────────────────────────────────────────────
networks:
  boxing_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
